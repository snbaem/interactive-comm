name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      # [llm] installs the Anthropic SDK so its adapter test runs (offline, mock transport).
      - run: python -m pip install -e ".[dev,llm]"
      - run: python -m pytest
      # Smoke-test the installed console script end to end (same commands as the README).
      - run: icsel samples --out samples/letters
      - run: icsel match samples/letters --out out
      - run: icsel profile samples/letters/L01-classic.pdf
      - run: icsel show-layout classic-left --compare subject-right --out out/layouts
      - run: icsel portfolio samples/letters --out out/portfolio
      - run: icsel eval samples/letters --out out/eval
      - run: icsel samples --portfolio --out samples/portfolio
